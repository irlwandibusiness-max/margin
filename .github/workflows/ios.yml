name: Build Margin IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install and add iOS platform
        working-directory: mobile
        run: |
          npm install
          npx cap add ios
          npx @capacitor/assets generate --ios || true
          npx cap sync ios
      - name: Build unsigned app
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 30
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Margin.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Margin-ipa, path: mobile/ios/App/Margin.ipa }
